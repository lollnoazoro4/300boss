<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김권일 본부장님 생신 축하 룰렛</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; background: radial-gradient(circle, #fff5f5, #ffe3e3);
            font-family: 'Malgun Gothic', sans-serif; overflow: hidden;
        }
        h1 { color: #d63031; text-align: center; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); line-height: 1.4; }
        
        /* 게임 전체 감싸기 */
        .game-wrapper { position: relative; width: 500px; height: 500px; }
        
        /* 룰렛 캔버스 */
        #wheelCanvas { 
            width: 100%; height: 100%; border-radius: 50%; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.15); border: 10px solid #fff;
            background-color: white;
        }

        /* 화살표 */
        .arrow {
            position: absolute; top: -35px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent;
            border-top: 40px solid #ff4757; z-index: 30; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2));
        }

        /* ▼▼▼ 중앙 사진 영역 수정됨 ▼▼▼ */
        .boss-center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 160px; height: 160px; /* 크기를 약간 키웠습니다 */
            z-index: 20;
            
            /* 배경색과 테두리를 투명하게 변경 */
            background-color: transparent;
            border: none;
            
            /* 혹시 모를 사각형 이미지를 위해 원형 마스크는 유지 */
            border-radius: 50%;
            overflow: hidden;
            
            /* 클릭 이벤트를 통과시켜 룰렛 회전에 방해되지 않게 함 */
            pointer-events: none;
        }
        .boss-center img { 
            width: 100%; height: 100%; 
            object-fit: cover; /* 영역에 꽉 차게 */
            /* 얼굴이 붕 떠보이도록 이미지 자체에 부드러운 그림자 추가 */
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.4));
        }
        /* ▲▲▲ 수정 끝 ▲▲▲ */

        /* 하단 버튼 및 결과 */
        .controls { margin-top: 40px; text-align: center; }
        button {
            padding: 16px 70px; font-size: 1.6rem; font-weight: bold; color: white;
            background: linear-gradient(45deg, #d63031, #fd79a8); border: none; border-radius: 50px;
            cursor: pointer; transition: 0.2s; box-shadow: 0 8px 20px rgba(214, 48, 49, 0.3);
        }
        button:hover { transform: scale(1.05) translateY(-3px); }
        button:active { transform: scale(0.98); }
        #result-text { margin-top: 25px; font-size: 1.8rem; font-weight: bold; color: #2d3436; min-height: 40px; }
    </style>
</head>
<body>

    <h1>🎂 김권일 본부장님! 생일 축하드립니다! 🎂<br>돌리시죠!</h1>

    <div class="game-wrapper">
        <div class="arrow"></div>
        <canvas id="wheelCanvas" width="600" height="600"></canvas>
        <div class="boss-center">
            <img src="boss_face.png" alt="본부장님" onerror="this.style.display='none';">
        </div>
    </div>

    <div class="controls">
        <button id="spinBtn">START!</button>
        <div id="result-text"></div>
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const resultText = document.getElementById('result-text');

        // 요청하신 10가지 항목
        const prizes = [
            "힘찬 박수", "점심 식사 이용권", "맨투맨(의류)", "슬미의 2시간 야근", "간식 찬스", 
            "꽝", "저녁 식사 이용권", "꽝", "힘찬 박수", "귤 2kg"
        ];
        
        const colors = [
            "#ff7675", "#fdcb6e", "#e17055", "#00b894", "#0984e3", 
            "#6c5ce7", "#d63031", "#b2bec3", "#fab1a0", "#ffeaa7"
        ];

        let currentRotation = 0;
        let isSpinning = false;

        // 원판 그리기 함수
        function drawWheel() {
            const numSegments = prizes.length;
            const segmentAngle = (2 * Math.PI) / numSegments;

            ctx.clearRect(0, 0, 600, 600);

            prizes.forEach((prize, i) => {
                const angle = i * segmentAngle;
                
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(300, 300);
                ctx.arc(300, 300, 300, angle, angle + segmentAngle);
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.translate(300, 300);
                ctx.rotate(angle + segmentAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "white";
                ctx.font = "bold 20px 'Malgun Gothic'";
                ctx.fillText(prize, 270, 10);
                ctx.restore();
            });
        }

        // 돌리기 기능
        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true; // 버튼 중복 클릭 방지
            spinBtn.style.opacity = "0.7";
            resultText.innerText = "두구두구두구... 과연?!";

            const randomRotate = Math.floor(Math.random() * 360) + 3600; // 10바퀴 이상
            currentRotation += randomRotate;

            canvas.style.transition = "transform 5s cubic-bezier(0.15, 0, 0.15, 1)";
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                spinBtn.style.opacity = "1";
                const actualDegree = currentRotation % 360;
                const segmentAngle = 360 / prizes.length;
                
                const winningIndex = Math.floor((360 - actualDegree + 270) % 360 / segmentAngle);
                const winner = prizes[winningIndex];

                resultText.innerHTML = `🎊 [ <span style="color:#d63031;">${winner}</span> ] 당첨! 축하드려요! 🎉`;
                
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }, 5000);
        }

        spinBtn.addEventListener('click', spinWheel);
        drawWheel();
    </script>
</body>
</html>
